# 站点入口样例（宿主机 Nginx）：只反代 127.0.0.1:8787。
#
# 页面、_next、/api/* 都由同一个 Hono 进程提供（STATIC_ROOT=apps/frontend/out），
# 所以这里不设 root，也不直接分发任何静态文件。
#
# 旧默认语言前缀（/en/*）→ 无前缀的 301 由进程自己发，
# 见 apps/backend/src/lib/static-site.ts；反代侧不需要重复。
#
# TLS 交给 Certbot 或你的证书管理；本文件只演示 HTTP。

server {
    listen 80;
    server_name example.com www.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 反向代理终结 TLS 时，用它判断 Cookie 是否带 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端也会发同名的头；这里保的是 Nginx 自己生成的响应（404、502 等）。
    # location 里一旦出现 add_header，这些 server 级的头就不再继承。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
